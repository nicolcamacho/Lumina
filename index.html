<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina | Beauty & Skincare</title>
  
  <!-- Tipografía de alta gama de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #c89687;
      --primary-dark: #a67264;
      --bg-color: #faf7f5;
      --text-main: #2b2b2b;
      --text-muted: #737373;
      --white: #ffffff;
      --border-color: #eae3de;
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }


    * { box-sizing: border-box; margin: 0; padding: 0; }


    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
    }


    /* NAVEGACIÓN Y ENLACES DE SALTO */
    .navbar {
      background: rgba(255, 255, 255, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      border-bottom: 1px solid var(--border-color);
    }


    .logo {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--primary-dark);
    }


    .nav-links { display: flex; gap: 30px; }


    /* ENLACE 1 Y ENLACE 2 */
    .nav-link {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
      cursor: pointer;
    }


    .nav-link:hover, .nav-link.active { color: var(--primary-color); }


    .badge {
      background: var(--primary-color);
      color: var(--white);
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 0.7rem;
      margin-left: 5px;
    }


    /* HERO BANNER */
    .hero {
      height: 35vh;
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                  url('https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1200&q=80') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--white);
      padding: 0 20px;
    }


    .hero h1 {
      font-family: var(--font-heading);
      font-size: 3rem;
      font-weight: 400;
    }


    /* CONTENEDOR DE PRODUCTOS */
    .container {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 20px;
    }


    .section-title { text-align: center; margin-bottom: 40px; }
    .section-title h2 { font-family: var(--font-heading); font-size: 2.2rem; }
    .divider { width: 50px; height: 2px; background: var(--primary-color); margin: 10px auto 0; }


    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }


    .card {
      background: var(--white);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease;
    }


    .card:hover { transform: translateY(-5px); }


    .img-container { height: 260px; width: 100%; }


    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .card-body { padding: 20px; text-align: center; }


    .category {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    .card-body h3 {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      margin: 5px 0 10px;
    }


    .price {
      font-size: 1.1rem;
      color: var(--primary-dark);
      font-weight: 600;
      margin-bottom: 15px;
    }


    /* BOTONES */
    .btn {
      background: var(--primary-color);
      color: var(--white);
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.3s;
    }


    .btn:hover { background: var(--primary-dark); }


    .btn-secondary { background: #666; }


    /* SECCIÓN DEL CARRITO EN LA MISMA PÁGINA / NAVEGACIÓN */
    #vista-carrito { display: none; }


    .cart-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      margin-top: 20px;
      box-shadow: var(--shadow);
    }


    .cart-table th, .cart-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }


    .cart-table th { background: #f7f3f0; text-transform: uppercase; font-size: 0.75rem; }


    .cart-summary {
      margin-top: 20px;
      text-align: right;
      background: var(--white);
      padding: 20px;
      box-shadow: var(--shadow);
    }


    .cart-summary h3 { font-size: 1.4rem; margin-bottom: 15px; }


    .actions { display: flex; justify-content: flex-end; gap: 15px; }
  </style>
</head>
<body>


  <!-- ENCABEZADO Y NAVEGACIÓN DE SALTOS ENTRE VISTAS -->
  <header class="navbar">
    <div class="logo">LUMINA</div>
    <nav class="nav-links">
      <!-- SALTO 1: Ver Catálogo -->
      <a class="nav-link active" id="btn-catalogo" onclick="cambiarVista('catalogo')">Colección</a>
      <!-- SALTO 2: Ver Carrito -->
      <a class="nav-link" id="btn-carrito" onclick="cambiarVista('carrito')">
        Carrito <span class="badge" id="cart-count">0</span>
      </a>
    </nav>
  </header>


  <!-- VISTA 1: CATÁLOGO DE PRODUCTOS -->
  <div id="vista-catalogo">
    <section class="hero">
      <div>
        <h1>Esencia & Belleza Natural</h1>
      </div>
    </section>


    <main class="container">
      <div class="section-title">
        <h2>Nuestros Productos Destacados</h2>
        <div class="divider"></div>
      </div>


      <div class="products-grid" id="contenedor-productos">
        <!-- Los 3 Productos se generan dinámicamente mediante la Tabla 1 de la Base de Datos -->
      </div>
    </main>
  </div>


  <!-- VISTA 2: CARRITO DE COMPRAS -->
  <div id="vista-carrito">
    <main class="container">
      <div class="section-title">
        <h2>Tu Carrito de Compras</h2>
        <div class="divider"></div>
      </div>


      <table class="cart-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="cart-items">
          <!-- Los ítems del Carrito se leen desde la Tabla 2 (LocalStorage) -->
        </tbody>
      </table>


      <div class="cart-summary">
        <h3>Total: $<span id="cart-total">0</span></h3>
        <div class="actions">
          <button class="btn btn-secondary" style="width: auto;" onclick="vaciarCarrito()">Vaciar Carrito</button>
          <button class="btn" style="width: auto;" onclick="finalizarCompra()">Proceder al Pago</button>
        </div>
      </div>
    </main>
  </div>


  <!-- BASE DE DATOS Y LÓGICA EN JAVASCRIPT (SIN PHP) -->
  <script>
    // ==========================================
    // BASE DE DATOS (Mínimo 2 Tablas)
    // ==========================================


    // TABLA 1: Inventario de Productos (Contiene los datos del catálogo, imágenes y precios)
    const tablaProductos = [
      {
        id: 1,
        nombre: 'Sérum Facial Illuminating',
        categoria: 'Cuidado Facial',
        precio: 25000,
        imagen: 'https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=600&q=80' // IMAGEN 1
      },
      {
        id: 2,
        nombre: 'Crema Rejuvenecedora Rose',
        categoria: 'Tratamiento de Noche',
        precio: 32000,
        imagen: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=600&q=80' // IMAGEN 2
      },
      {
        id: 3,
        nombre: 'Bálsamo Humectante Nude',
        categoria: 'Labios',
        precio: 15000,
        imagen: 'https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&w=600&q=80' // IMAGEN 3
      }
    ];


    // TABLA 2: Carrito / Pedidos (Guardada en LocalStorage)
    function obtenerTablaCarrito() {
      const data = localStorage.getItem('db_lumina_carrito');
      return data ? JSON.parse(data) : [];
    }


    function guardarTablaCarrito(carrito) {
      localStorage.setItem('db_lumina_carrito', JSON.stringify(carrito));
      actualizarContadorHeader();
    }


    // ==========================================
    // RENDERIZADO DE PRODUCTOS (TABLA 1 -> VISTA)
    // ==========================================
    function cargarProductos() {
      const contenedor = document.getElementById('contenedor-productos');
      contenedor.innerHTML = '';


      tablaProductos.forEach(prod => {
        contenedor.innerHTML += `
          <div class="card">
            <div class="img-container">
              <img src="${prod.imagen}" alt='${prod.nombre}'' class="card-img">
            </div>
            <div class="card-body">
              <p class="category">${prod.categoria}</p>
              <h3>${prod.nombre}</h3>
              <p class="price">$${prod.precio.toLocaleString()}</p>
              <!-- BOTÓN (3 Botones en el Catálogo) -->
              <button class="btn" onclick="agregarAlCarrito(${prod.id})">Añadir al Carrito</button>
            </div>
          </div>
        `;
      });
    }


    // ==========================================
    // OPERACIONES DE CARRITO (TABLA 2)
    // ==========================================
    function agregarAlCarrito(idProducto) {
  const producto = tablaProductos.find(p => p.id === idProducto);
  let carrito = obtenerTablaCarrito();
  let item = carrito.find(p => p.id === idProducto);


  if (item) {
    item.cantidad += 1;
    item.subtotal = item.cantidad * item.precio;
  } else {
    carrito.push({
      id: producto.id,
      nombre: producto.nombre,
      precio: producto.precio,
      cantidad: 1,
      subtotal: producto.precio
    });
  }


  guardarTablaCarrito(carrito);
  
  // AQUÍ ESTÁ LA CORRECCIÓN:
  alert(producto.nombre + ' añadido correctamente.');
}


    function mostrarCarrito() {
      const carrito = obtenerTablaCarrito();
      const tablaBody = document.getElementById('cart-items');
      const totalSpan = document.getElementById('cart-total');


      tablaBody.innerHTML = '';
      let total = 0;


      if (carrito.length === 0) {
        tablaBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px; color: #888;">Tu carrito está vacío.</td></tr>';
      } else {
        carrito.forEach(item => {
          total += item.subtotal;
          tablaBody.innerHTML += `
            <tr>
              <td><strong>${item.nombre}</strong></td>
              <td>$${item.precio.toLocaleString()}</td>
              <td>${item.cantidad}</td>
              <td>$${item.subtotal.toLocaleString()}</td>
            </tr>
          `;
        });
      }


      totalSpan.textContent = total.toLocaleString();
    }


    function vaciarCarrito() {
      localStorage.removeItem('db_lumina_carrito');
      mostrarCarrito();
      actualizarContadorHeader();
    }


    function finalizarCompra() {
      const carrito = obtenerTablaCarrito();
      if (carrito.length === 0) {
        alert("Tu carrito está vacío.");
        return;
      }
      alert("¡Gracias por tu compra en Lumina ✨! Tu pedido fue procesado con éxito.");
      vaciarCarrito();
    }


    function actualizarContadorHeader() {
      const countSpan = document.getElementById('cart-count');
      const carrito = obtenerTablaCarrito();
      const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      countSpan.textContent = totalItems;
    }


    // NAVEGACIÓN / SALTOS ENTRE VISTAS
    function cambiarVista(vista) {
      const vistaCatalogo = document.getElementById('vista-catalogo');
      const vistaCarrito = document.getElementById('vista-carrito');
      const btnCatalogo = document.getElementById('btn-catalogo');
      const btnCarrito = document.getElementById('btn-carrito');


      if (vista === 'catalogo') {
        vistaCatalogo.style.display = 'block';
        vistaCarrito.style.display = 'none';
        btnCatalogo.classList.add('active');
        btnCarrito.classList.remove('active');
      } else {
        vistaCatalogo.style.display = 'none';
        vistaCarrito.style.display = 'block';
        btnCatalogo.classList.remove('active');
        btnCarrito.classList.add('active');
        mostrarCarrito();
      }
    }


    // Inicializar la carga al abrir el documento
    document.addEventListener('DOMContentLoaded', () => {
      cargarProductos();
      actualizarContadorHeader();
    });
  </script>
</body>
</html>
